<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Библиотеки файла</title>
<style>
* { box-sizing: border-box }
body { margin: 0; height: 100vh; display: flex; flex-direction: column; color: #222535; background: #fafafd; font: 14px/1.45 system-ui, sans-serif }
header, footer { padding: 16px 20px; background: white }
header, .tools, footer, .row { display: flex; align-items: center; gap: 12px }
header, .row { border-bottom: 1px solid #e1e3eb }
header, footer { justify-content: space-between }
h1 { font-size: 20px; margin: 0 }
button, input { font: inherit }
button, input[type=search] { border: 1px solid #b9bdcb; border-radius: 7px; background: white; color: inherit; padding: 7px 12px }
button:enabled, label { cursor: pointer }
button:disabled { opacity: .5 }
#apply { background: #4945b8; color: white; border-color: transparent }
.tools { padding: 12px 20px }
input[type=search] { flex: 1; min-width: 0 }
input[type=checkbox] { accent-color: #4945b8; width: 16px; height: 16px; flex: none }
.tools label { display: flex; align-items: center; gap: 4px }
main { overflow: auto; flex: 1; padding: 0 20px }
.row { background: white; padding: 10px; overflow-wrap: anywhere }
.row span { min-width: 0 }
small { display: block; color: #595d70 }
footer { border-top: 1px solid #e1e3eb }
#notice { margin: 0; padding: 0 20px 8px; white-space: pre-line; max-height: 100px; overflow: auto }
#notice:empty, [hidden] { display: none }
</style>
<header><h1>Библиотеки файла</h1><button id="scan">Сканировать</button></header>
<div class="tools" hidden><input type="search" id="search" aria-label="Поиск по названию" placeholder="Поиск по названию"><label><input id="filter" type="checkbox">Триплекс</label></div>
<main><p id="empty">Нажмите «Сканировать», чтобы увидеть доступные библиотеки.</p><div id="list"></div></main>
<p id="notice" role="status"></p>
<footer><span id="summary"></span><button id="apply" disabled>Выполнить</button></footer>
<script>
const byId = id => document.getElementById(id);
const scan = byId("scan"), apply = byId("apply"), search = byId("search"), filter = byId("filter");
const list = byId("list"), notice = byId("notice"), empty = byId("empty");
let rows = [];
let busy = false;

function changes() {
  return rows.filter(row => row.target !== row.subscribed);
}
function summarize() {
  const pending = changes();
  const enable = pending.filter(row => row.target).length;
  byId("summary").textContent = 'Включить: ' + enable + ' · Отключить: ' + (pending.length - enable);
  apply.disabled = busy || !pending.length;
}
function render() {
  const query = search.value.trim().toLowerCase();
  const visible = rows.filter(row => (!filter.checked || row.triplex) && row.name.toLowerCase().includes(query));
  list.textContent = "";
  empty.hidden = visible.length > 0;
  empty.textContent = rows.length ? "Совпадений нет." : "Доступных библиотек нет.";
  for (const row of visible) {
    const label = document.createElement("label");
    label.className = "row";
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = row.target;
    checkbox.disabled = busy;
    checkbox.onchange = () => { row.target = checkbox.checked; summarize(); };
    const name = document.createElement("span");
    name.textContent = row.name;
    const detail = document.createElement("small");
    detail.textContent = [row.team, row.subscribed ? "Подключена" : "Отключена"].filter(Boolean).join(" · ");
    name.append(detail);
    label.append(checkbox, name);
    list.append(label);
  }
  summarize();
}
const routes = { parent: window.parent };
if (window.top !== window.parent) routes.top = window.top;
let activeRoute;
let envelope = { pluginId: "triplex-library-manager" };
let requestId = 0;
let initialResult;
let waitingForInitial = false;
let watchdog;
function post(via, message) {
  const data = { ...envelope, pluginMessage: message };
  const wrapped = via === "parent" && location.origin === "http://localhost:5201";
  routes[via].postMessage(wrapped ? { __fromPluginUi: true, payload: data } : data, "*");
}
function watchReply() {
  clearTimeout(watchdog);
  watchdog = setTimeout(() => finish({
    type: "error", detail: "Окно не получило результат от Pixso за 35 секунд."
  }), 35000);
}
function request(type) {
  busy = true;
  scan.disabled = true;
  waitingForInitial = type === "scan" && requestId === 0;
  ++requestId;
  notice.textContent = type === "scan" ? "Ожидание списка библиотек от Pixso…" : "Применение изменений…";
  watchReply();
  if (waitingForInitial && initialResult && Date.now() - initialResult.received < 12000) {
    finish(initialResult.message);
    return;
  }
  for (const checkbox of list.querySelectorAll("input")) checkbox.disabled = true;
  apply.disabled = true;
  const message = { type, id: requestId, changes: changes().map(({ key, target }) => ({ key, target })) };
  for (const via of activeRoute ? [activeRoute] : Object.keys(routes)) post(via, message);
}
scan.onclick = () => request("scan");
apply.onclick = () => request("apply");
search.oninput = filter.onchange = render;
window.addEventListener("message", event => {
  const raw = event.data;
  const msg = raw && raw.pluginMessage;
  if (!msg) return;
  if (event.source && !Object.values(routes).includes(event.source) && event.source !== window) return;
  if (msg.type === "hello") {
    const { pluginMessage, ...routing } = raw;
    envelope = { ...envelope, ...routing };
    if (msg.pluginId) envelope.pluginId = msg.pluginId;
    if (Object.prototype.hasOwnProperty.call(routes, msg.via)) activeRoute = msg.via;
    else if (!activeRoute) handshake();
    return;
  }
  if (msg.type === "initial") {
    const message = { ...msg, type: msg.detail ? "error" : "scan" };
    initialResult = { message, received: Date.now() };
    if (waitingForInitial && busy) finish(message);
    return;
  }
  if (!busy || msg.id !== requestId) return;
  if (msg.type === "progress") {
    watchReply();
    if (waitingForInitial) notice.textContent = "Pixso читает список библиотек…";
    if (msg.library) notice.textContent = "Применение изменений · " + msg.library;
    return;
  }
  if (["scan", "apply", "error"].includes(msg.type)) finish(msg);
});
function handshake() {
  for (const via of Object.keys(routes)) post(via, { type: "ready", via });
}
function finish(msg) {
  waitingForInitial = false;
  busy = false;
  scan.disabled = false;
  try {
    if (msg.type === "error") throw new Error(msg.detail);
    showResult(msg);
  } catch (error) {
    notice.textContent = (error.message || String(error)) + " Повторите сканирование.";
    rows = [];
    list.textContent = "";
    document.querySelector(".tools").hidden = true;
    empty.hidden = true;
    byId("summary").textContent = "";
    apply.disabled = true;
  } finally {
    clearTimeout(watchdog);
  }
}
function showResult(msg) {
  const previous = new Map(rows.map(row => [row.key, row]));
  rows = msg.libraries.map(row => {
    const old = previous.get(row.key);
    const target = msg.type === "scan" ? row.triplex :
      old && old.name === row.name && old.target !== old.subscribed ? old.target : row.subscribed;
    return { ...row, target };
  });
  if (msg.type === "scan") {
    search.value = "";
    filter.checked = false;
  }
  document.querySelector(".tools").hidden = false;
  render();
  notice.textContent = msg.type === "scan" ? "Найдено библиотек: " + rows.length :
    msg.errors.length ? msg.errors.join("\n") :
    changes().length ? "Pixso ещё не подтвердил все изменения." : "Выбранные изменения применены.";
}
handshake();
</script>
</html>
