<!doctype html>
<html lang="ru"><meta charset="utf-8"><title>Экспорт токенов</title>
<style>
* {box-sizing:border-box} body {margin:0;padding:16px;height:100vh;display:flex;flex-direction:column;gap:12px;font:14px system-ui;color:#242229}
p {margin:0} textarea {flex:1;padding:12px;resize:none;border:1px solid #ccc;border-radius:6px;font:12px monospace}
button {align-self:flex-end;padding:9px 14px;background:#5338be;color:white;border:0;border-radius:6px} button:disabled {opacity:.45}
fieldset {display:grid;gap:7px;border:1px solid #ccc;border-radius:6px} fieldset textarea {min-height:65px} input {padding:4px}
</style>
<p id="status" role="status">Подключаюсь к Figma…</p>
<textarea readonly aria-label="Архитектура токенов в JSON" spellcheck="false"></textarea>
<div><button id="scan">Сканировать</button> <button id="download" disabled>Скачать JSON</button></div>
<fieldset disabled id="importer"><legend>Коллекция Components</legend>
<label for="table">Вставьте таблицу с заголовками component, property, type и столбцами режимов. Поддерживается также таблица с путём токена в первом столбце.</label>
<textarea id="table" placeholder="Вставьте ячейки вместе с заголовками"></textarea>
<label>Или файл CSV / TSV <input type="file" id="file" accept=".csv,.tsv,text/csv,text/tab-separated-values"></label>
<button id="add">Добавить коллекцию</button></fieldset>
<script>
const preview = document.querySelector('textarea');
const button = document.querySelector('#download');
const scan = document.querySelector('#scan');
const statusLine = document.getElementById('status');
const importer = document.querySelector('#importer');
const table = document.querySelector('#table');
const file = document.querySelector('#file');
const add = document.querySelector('#add');
file.onchange = async () => {
  const selected = file.files[0];
  if (!selected) return;
  scan.disabled = true;
  importer.disabled = true;
  try { table.value = await selected.text(); }
  catch { statusLine.textContent = 'Не удалось прочитать файл.'; }
  finally { scan.disabled = false; importer.disabled = false; file.value = ''; }
};
add.onclick = () => {
  scan.disabled = true;
  importer.disabled = true;
  parent.postMessage({pluginMessage: {type: 'import', text: table.value}}, '*');
};
let timer;
function watch(stage) {
  clearTimeout(timer);
  timer = setTimeout(() => {
    statusLine.textContent = stage + ' Ответ задерживается. Можно подождать или перезапустить плагин.';
  }, 30000);
}
window.onmessage = event => {
  const message = event.data.pluginMessage;
  if (!message) return;
  if (message.importError) {
    scan.disabled = false;
    importer.disabled = false;
    statusLine.textContent = message.importError;
    return;
  }
  if (message.status) {
    statusLine.textContent = message.status;
    watch(message.status);
    return;
  }
  if (typeof message.json !== 'string' && !message.error) return;
  clearTimeout(timer);
  statusLine.textContent = message.error || (message.json === '{}' ? 'В файле нет локальных коллекций.' : 'Архитектура токенов готова.');
  scan.disabled = false;
  preview.value = message.json || '';
  button.disabled = !message.json;
  importer.disabled = !message.json;
  if (message.added) statusLine.textContent = 'Добавлена коллекция «' + message.added + '».';

};
function startScan() {
  scan.disabled = true;
  button.disabled = true;
  importer.disabled = true;
  statusLine.textContent = 'Подключаюсь к Figma…';
  watch(statusLine.textContent);
  parent.postMessage({pluginMessage: {type: 'scan'}}, '*');
}
scan.onclick = startScan;
startScan();
button.onclick = () => {
  const url = URL.createObjectURL(new Blob([preview.value], {type:'application/json'}));
  const link = document.createElement('a');
  link.href = url;
  link.download = 'triplex-tokens.json';
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};
</script></html>
